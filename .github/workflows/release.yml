name: Release

# Publishes the GitHub release of a pushed version tag, with the section of the tag
# in CHANGELOG.md as its notes. The tag must be the version of the manifest; the
# tests check that the other places that name the version agree with it.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag is the version of the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version custom_components/sbm_fizikus/manifest.json)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::The tag $TAG is not the version of the manifest, $version"
            exit 1
          fi
      - name: Take the notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The lines between the heading of the tag and the next heading, without
          # the blank lines around them.
          awk -v tag="$TAG" '
            /^## / { found = (index($0, "## " tag " (") == 1); next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release made by hand, which also creates the tag, stays as it is.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
